<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - Health Mate</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e6f4f8, #c7e5ed);
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
        }

        /* Background Circuit Grid effect matching login */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, rgba(2, 132, 199, 0.15) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            padding: 20px 30px 40px 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Top Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(186, 230, 253, 0.6);
            margin-bottom: 30px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: #0284c7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }

        .logo-text h1 {
            margin: 0;
            font-size: 18px;
            color: #0f172a;
            font-weight: 700;
        }

        .logo-text span {
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(186, 230, 253, 0.8);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: #cbd5e1;
        }

        .user-info-text {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            line-height: 1.2;
        }

        .user-info-text span {
            display: block;
            font-size: 10px;
            color: #64748b;
            font-weight: normal;
        }

        /* Main Container Card matching screenshot layout */
        .container {
            background: rgba(240, 244, 248, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 12px 12px 25px rgba(163, 177, 198, 0.4), 
                        -10px -10px 25px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        h2.title {
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }

        .section {
            margin-bottom: 25px;
            padding: 22px 25px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: inset 2px 2px 5px rgba(163, 177, 198, 0.1);
            position: relative;
        }

        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 8px;
        }

        .section h3 {
            margin: 0;
            color: #0369a1;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verified-badge-top {
            font-size: 11px;
            font-weight: 600;
            color: #059669;
            background: #d1fae5;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #a7f3d0;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
        }

        .input-with-icon {
            position: relative;
        }

        input {
            width: 100%;
            padding: 10px 35px 10px 12px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #0284c7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .edit-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
        }

        .error-msg {
            color: #dc2626;
            font-size: 11px;
            margin-top: 3px;
            display: none;
        }

        /* Next Button Section matching screenshot */
        .btn-wrapper {
            text-align: center;
            margin-top: 25px;
        }

        button.next-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }

        button.next-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0369a1, #075985);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.45);
        }

        footer {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 30px;
        }
    </style>
</head>

            </div>
