<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Health Mate</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 35px rgba(2, 132, 199, 0.1);
            border: 1px solid #bae6fd;
        }
        h2 {
            color: #0284c7;
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        .section {
            margin-bottom: 25px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
        .section h3 {
            margin-top: 0;
            color: #0369a1;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #0284c7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .error-msg {
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 30px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0369a1, #075985);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Doctor Dashboard Profile</h2>
    
    <form id="dashboardForm" onsubmit="handleDashboard(event)">
        <div class="section">
            <h3>Doctor Profile</h3>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="docName" placeholder="Enter your name">
                <div class="error-msg" id="nameError">Name is required.</div>
            </div>
            <div class="form-group">
                <label>Specialization:</label>
                <input type="text" id="docSpec" placeholder="Enter specialization">
                <div class="error-msg" id="specError">Specialization is required.</div>
            </div>
            <div class="form-group">
                <label>License:</label>
                <input type="text" id="docLicense" placeholder="Enter license number">
                <div class="error-msg" id="licenseError">License number is required.</div>
            </div>
        </div>

        <div class="section">
            <h3>Clinic Settings</h3>
            <div class="form-group">
                <label>Consultation Fees:</label>
                <input type="text" id="docFees" placeholder="Enter fees">
                <div class="error-msg" id="feesError">Consultation fee is required.</div>
            </div>
            <div class="form-group">
                <label>Availability:</label>
                <input type="text" id="docAvail" placeholder="e.g., Mon - Sat, 10:00 AM - 04:00 PM">
                <div class="error-msg" id="availError">Availability details are required.</div>
            </div>
        </div>

        <button type="submit">Next - Manage Appointments</button>
    </form>
</div>

<script>
    function handleDashboard(event) {
        event.preventDefault();
        const name = document.getElementById('docName').value.trim();
        const spec = document.getElementById('docSpec').value.trim();
        const license = document.getElementById('docLicense').value.trim();
        const fees = document.getElementById('docFees').value.trim();
        const avail = document.getElementById('docAvail').value.trim();
        let isValid = true;

        document.getElementById('nameError').style.display = name ? 'none' : 'block';
        document.getElementById('specError').style.display = spec ? 'none' : 'block';
        document.getElementById('licenseError').style.display = license ? 'none' : 'block';
        document.getElementById('feesError').style.display = fees ? 'none' : 'block';
        document.getElementById('availError').style.display = avail ? 'none' : 'block';

        if (name && spec && license && fees && avail) {
            window.location.href = 'appointments.html';
        }
    }
</script>

</body>
</html>
