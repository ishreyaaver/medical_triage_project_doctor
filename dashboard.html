<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Health Mate</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #bae6fd;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .section h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: 30px;
        }

        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Doctor Dashboard</h2>
    
    <form>
        <div class="section">
            <h3>Doctor Profile</h3>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Specialization:</label>
                <input type="text" placeholder="Enter specialization">
            </div>
            <div class="form-group">
                <label>License:</label>
                <input type="text" placeholder="Enter license number">
            </div>
        </div>

        <div class="section">
            <h3>Clinic Settings</h3>
            <div class="form-group">
                <label>Consultation Fees:</label>
                <input type="text" placeholder="Enter fees">
            </div>
            <div class="form-group">
                <label>Availability:</label>
                <input type="text" placeholder="e.g., Mon - Sat, 10:00 AM - 04:00 PM">
            </div>
        </div>

        <button type="button" onclick="window.location.href='appointments.html'">Next</button>
    </form>
</div>

</body>
</html>
