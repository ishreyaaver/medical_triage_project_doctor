<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Health Mate</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #bae6fd;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .section h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 10px;
        }

        .section p {
            margin: 5px 0;
            font-size: 14px;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: 30px;
        }

        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Doctor Dashboard</h2>
    
    <div class="section">
        <h3>Doctor Profile</h3>
        <p><strong>Name:</strong> Dr. Ananya Sharma</p>
        <p><strong>Specialization:</strong> Cardiology</p>
        <p><strong>License:</strong> MED-998877</p>
    </div>

    <div class="section">
        <h3>Clinic Settings</h3>
        <p><strong>Consultation Fees:</strong> ₹500</p>
        <p><strong>Availability:</strong> Mon - Sat, 10:00 AM - 04:00 PM</p>
    </div>

    <button type="button" onclick="window.location.href='appointments.html'">Next</button>
</div>

</body>
</html>
