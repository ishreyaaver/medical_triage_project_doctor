<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digi Janseva - Doctor Portal</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --secondary-color: #0ea5e9;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-sub {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Digi Janseva</h2>
        <div class="brand-sub">Doctor Portal - Secure Login & Registration</div>
        
        <form>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="doctor@digijanseva.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="********" required>
            </div>

            <div class="form-group">
                <label>Specialization</label>
                <select>
                    <option>Cardiology</option>
                    <option>Dermatology</option>
                    <option>General Physician</option>
                    <option>Pediatrics</option>
                </select>
            </div>

            <button type="submit">Login to Dashboard</button>
        </form>
    </div>

</body>
</html>
