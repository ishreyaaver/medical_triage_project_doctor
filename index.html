<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digi Janseva - Doctor Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd, #7dd3fc);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Detailed Medical & Neural Network Background SVG Container */
        .bg-neural-network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Neumorphic Login Card Style matching the exact reference */
        .login-card {
            background: #f0f4f8;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 20px 20px 40px rgba(163, 177, 198, 0.5), 
                        -20px -20px 40px rgba(255, 255, 255, 0.9),
                        inset 1px 1px 2px rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area svg.logo-icon {
            width: 42px;
            height: 42px;
            fill: #1e293b;
            margin-bottom: 6px;
        }

        h2 {
            color: #1e293b;
            text-align: center;
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 4px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 13px;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: #e2e8f0;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            box-shadow: inset 3px 3px 6px rgba(163, 177, 198, 0.5), 
                        inset -3px -3px 6px rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            box-shadow: inset 4px 4px 8px rgba(163, 177, 198, 0.7), 
                        inset -4px -4px 8px rgba(255, 255, 255, 1);
        }

        .extra-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .extra-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        .extra-options a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }

        .extra-options a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #dc2626;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(2, 132, 199, 0.5);
        }
    </style>
</head>
<body>

    <!-- Detailed Neural Network & DNA Circuit Background graphics connecting to the login box -->
    <svg class="bg-neural-network" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <!-- Left Side Neural / DNA branching lines -->
        <g stroke="#0284c7" stroke-width="1.5" fill="none" opacity="0.6">
            <path d="M0,200 Q200,200 350,350 T500,450" />
            <path d="M0,350 Q150,350 280,450 T450,550" stroke="#0d9488" />
            <path d="M0,500 Q220,500 380,480 T520,380" stroke="#38bdf8" />
            <path d="M0,650 Q180,650 320,550 T480,480" />
            <!-- Branching nodes/dots -->
            <circle cx="150" cy="200" r="4" fill="#0284c7"/>
            <circle cx="280" cy="300" r="3" fill="#0d9488"/>
            <circle cx="220" cy="450" r="5" fill="#38bdf8"/>
            <circle cx="380" cy="520" r="3" fill="#0284c7"/>
        </g>

        <!-- Right Side Neural / DNA branching lines -->
        <g stroke="#0284c7" stroke-width="1.5" fill="none" opacity="0.6">
            <path d="M1440,200 Q1240,200 1090,350 T940,450" />
            <path d="M1440,350 Q1290,350 1160,450 T990,550" stroke="#0d9488" />
            <path d="M1440,500 Q1220,500 1060,480 T920,380" stroke="#38bdf8" />
            <path d="M1440,650 Q1260,650 1120,550 T960,480" />
            <!-- Branching nodes/dots -->
            <circle cx="1290" cy="200" r="4" fill="#0284c7"/>
            <circle cx="1160" cy="300" r="3" fill="#0d9488"/>
            <circle cx="1220" cy="450" r="5" fill="#38bdf8"/>
            <circle cx="1060" cy="520" r="3" fill="#0284c7"/>
        </g>
    </svg>

    <div class="login-card">
        <div class="logo-area">
            <!-- Medical Cross / Caduceus Icon -->
            <svg class="logo-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            <h2>Digi Janseva</h2>
            <div class="subtitle">Doctor Portal Secure Login</div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-box">
                    <span>✉</span>
                    <input type="email" id="email" placeholder="doctor@gmail.com" value="doctor@gmail.com">
                </div>
                <div id="emailError" class="error-msg">Please enter a valid email address.</div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-box">
                    <span>🔒</span>
                    <input type="password" id="password" placeholder="••••••••" value="123456">
                </div>
                <div id="passError" class="error-msg">Password is required.</div>
            </div>

            <div class="extra-options">
                <label><input type="checkbox" checked> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Confirm & Login to Dashboard</button>
        </form>
    </div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        let isValid = true;

        if (!email) {
            document.getElementById('emailError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('emailError').style.display = 'none';
        }

        if (!password) {
            document.getElementById('passError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('passError').style.display = 'none';
        }

        if (isValid) {
            window.location.href = 'dashboard.html';
        }
    }
</script>

</body>
</html>
