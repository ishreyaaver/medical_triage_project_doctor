<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digi Janseva - Doctor Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e6f4f8, #c7e5ed);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Background Circuit Lines Effect (Neumorphic tech medical vibe) */
        body::before, body::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            width: 40%;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.35;
            z-index: 1;
        }
        body::before {
            left: 0;
            background-image: radial-gradient(circle, #0284c7 1px, transparent 1px);
            background-size: 30px 30px;
        }
        body::after {
            right: 0;
            background-image: radial-gradient(circle, #0284c7 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .login-card {
            background: #f0f4f8;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 15px 15px 30px rgba(163, 177, 198, 0.6), 
                        -15px -15px 30px rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area svg {
            width: 40px;
            height: 40px;
            fill: #0f172a;
            margin-bottom: 5px;
        }

        h2 {
            color: #1e293b;
            text-align: center;
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 4px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 13px;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            box-shadow: inset 3px 3px 6px rgba(163, 177, 198, 0.4), 
                        inset -3px -3px 6px rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            box-shadow: inset 4px 4px 8px rgba(163, 177, 198, 0.6), 
                        inset -4px -4px 8px rgba(255, 255, 255, 1);
        }

        .extra-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .extra-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        .extra-options a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }

        .extra-options a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #dc2626;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.5);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <!-- Medical Caduceus / Cross Icon -->
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <h2>Digi Janseva</h2>
        <div class="subtitle">Doctor Portal Secure Login</div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Email Address</label>
            <div class="input-box">
                <span>✉</span>
                <input type="email" id="email" placeholder="doctor@gmail.com" value="doctor@gmail.com">
            </div>
            <div id="emailError" class="error-msg">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-box">
                <span>🔒</span>
                <input type="password" id="password" placeholder="••••••••" value="123456">
            </div>
            <div id="passError" class="error-msg">Password is required.</div>
        </div>

        <div class="extra-options">
            <label><input type="checkbox" checked> Remember Me</label>
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Confirm & Login to Dashboard</button>
    </form>
</div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        let isValid = true;

        if (!email) {
            document.getElementById('emailError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('emailError').style.display = 'none';
        }

        if (!password) {
            document.getElementById('passError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('passError').style.display = 'none';
        }

        if (isValid) {
            window.location.href = 'dashboard.html';
        }
    }
</script>

</body>
</html>
